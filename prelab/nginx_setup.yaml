
- name: Setup NGINX Web Server
  hosts: localhost
  become: true

  tasks:
    - name: Install NGINX
      apt:
        name: nginx
        state: present

    - name: Ensure NGINX is running
      service:
        name: nginx
        state: started
        enabled: true

    - name: Create a custom index.html
      copy:
        content: "<h1>Welcome to Ansible Managed NGINX</h1>"
        dest: /var/www/html/index.html

