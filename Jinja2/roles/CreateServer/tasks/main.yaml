- name: Create Dir
  file:
    path: /var/www/html
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0777'

- name: Install NGINX
  apt:
    name: nginx
    state: present


- name: Deploy the template
  template:
    src: templates/index.html.j2
    dest: /var/www/html/index.html

- name: Deploy virtual hosts configuration
  template:
    src: templates/nginx_vhosts.conf.j2
    dest: /etc/nginx/conf.d/default.conf
- name: Restart NGINX
  service:
    name: nginx
    state: restarted